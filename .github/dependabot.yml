# Keeps the workflows' actions current: every action is pinned to a full
# commit with its version beside it, and Dependabot moves both together. A new
# release waits a week first, as pnpm's minimum release age does for packages,
# so a compromised release is usually caught before it reaches us. npm packages
# are updated on purpose, not by a bot (AGENTS.md working agreement 3);
# Dependabot's security updates still open a pull request when a dependency has
# a known vulnerability.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  # The relay's Node image (apps/relay/Dockerfile, ADR 0140) is pinned to a
  # digest; this moves the digest with its tag. Its Node line follows Conch's
  # (an LTS, `engines.node`), changed on purpose, so a new major isn't offered.
  - package-ecosystem: docker
    directory: /apps/relay
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: ci
