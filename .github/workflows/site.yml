name: Website

# conchagent.com: the front page and the documentation (apps/docs), every page
# drawn ahead of time, published to GitHub Pages whenever main changes.
#
# Once, in the repository's Settings → Pages: Source "GitHub Actions", custom
# domain conchagent.com, Enforce HTTPS. DNS for the domain: docs/RELEASING.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time; a newer push waits rather than cancelling one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The sitemap says when each page last changed, from its file's history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
