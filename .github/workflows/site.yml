name: Website

# Publish only validated main or a verified stable release (ADR 0093).
# Always run this orchestration from main, never from a release/PR's workflow.
# The Release workflow starts it when it publishes a release (ADR 0127): a
# release published with GitHub's own token starts nothing by itself.
on:
  # It builds main's own code only (never a pull request's: see the job's `if`).
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI, Desktop app]
    types: [completed]
  release:
    types: [published, edited, deleted]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read # the code, the releases and their tags
  actions: read # which runs of CI passed

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    if: >-
      github.repository == 'georgevibing/conch-agent' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request' &&
        (github.event.workflow_run.name != 'CI' || github.event.workflow_run.head_branch == 'main') &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # What's published is built from nothing cached.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Test publication rules
        run: pnpm --filter @conch/docs exec vitest run src/site/publication.test.ts --maxWorkers=2
      - name: Select verified releases and validated main
        id: selection
        working-directory: apps/docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx publishing/prepare.ts
      - name: Check out the exact content revisions
        env:
          PRODUCTION: ${{ steps.selection.outputs.production }}
          NEXT: ${{ steps.selection.outputs.next }}
        run: |
          git worktree add --detach .site/production "$PRODUCTION"
          git worktree add --detach .site/next "$NEXT"
      - name: Build the public site from its own code
        working-directory: .site/production
        env:
          CONCH_SITE_MANIFEST: ${{ github.workspace }}/.site/production.json
        run: |
          pnpm install --frozen-lockfile
          pnpm docs:build
      - name: Build development documentation from its own code
        working-directory: .site/next
        env:
          CONCH_SITE_MANIFEST: ${{ github.workspace }}/.site/next.json
          CONCH_DOCS_BASE: /docs/next/
        run: |
          pnpm install --frozen-lockfile
          pnpm docs:build
      - name: Assemble and check one deployable site
        run: node apps/docs/scripts/assemble.mjs
      - name: Check the published pages in a browser
        run: |
          pnpm exec playwright install --with-deps chromium
          node apps/docs/scripts/published-smoke.mjs
      - name: Refuse a stale selection
        working-directory: apps/docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx publishing/prepare.ts --verify
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .site/output

  deploy:
    name: Publish it
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publishes the site
      id-token: write # proves to Pages which workflow it is
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
