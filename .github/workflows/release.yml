name: Release

# How Conch is released (ADR 0127, docs/RELEASING.md). On every push to main,
# release-please keeps one release pull request up to date (the version, from
# the conventional commits), and Conch writes its notes into it. Merging that
# pull request is the release: this signs the tag, makes the GitHub Release
# as a draft, builds the apps onto it, and publishes it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Finish releasing this version (0.3.0), if a run stopped after its tag was made. Leave empty for the usual run.'
        required: false
        default: ''
      rehearse:
        description: 'Rehearse: sign a throwaway tag with the release key in the runner, check it as installs do, write a release page, and push nothing.'
        type: boolean
        default: false

permissions: {}

# One at a time, never cancelled: a release half made is finished by the next run.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Who commits Conch's notes to the release pull request.
  BOT_NAME: Conch releases
  BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  plan:
    name: Is there a release to make?
    if: github.repository == 'georgevibing/conch-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # reads the manifest at the merge
      pull-requests: read # finds the merged release pull request
    outputs:
      release: ${{ steps.find.outputs.release }}
      version: ${{ steps.find.outputs.version }}
      ref: ${{ steps.find.outputs.ref }}
      published: ${{ steps.find.outputs.published }}
      rehearse: ${{ steps.find.outputs.rehearse }}
    steps:
      - name: Find a merged release pull request that isn't tagged yet
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESUME: ${{ inputs.version }}
          REHEARSE: ${{ inputs.rehearse }}
        run: |
          set -euo pipefail
          if [ "${REHEARSE:-false}" = true ]; then
            echo "A rehearsal: nothing is released."
            { echo "rehearse=true"; echo "release=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${RESUME:-}" ]; then
            version="${RESUME#v}"
            ref="v${version}"
            gh api "repos/${GH_REPO}/git/ref/tags/${ref}" --silent || { echo "::error::${ref} isn't tagged, so there's nothing to finish."; exit 1; }
            # Published already: only what comes after publishing is left to do.
            draft=$(gh release view "$ref" --json isDraft --jq .isDraft 2>/dev/null || echo true)
            [ "$draft" = false ] && echo "published=true" >> "$GITHUB_OUTPUT"
          else
            # release-please labels the release pull request "autorelease: pending"
            # until its release is made, then "autorelease: tagged". Asked the way
            # release-please asks (GraphQL), not through search, which lags a merge.
            found=$(gh api graphql -F owner="${GH_REPO%%/*}" -F name="${GH_REPO##*/}" -f query='
              query($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) {
                  pullRequests(states: MERGED, baseRefName: "main", labels: ["autorelease: pending"], first: 10) {
                    nodes { number mergeCommit { oid } }
                  }
                }
              }' --jq '.data.repository.pullRequests.nodes[] | "\(.number) \(.mergeCommit.oid)"')
            count=$(printf '%s' "$found" | grep -c . || true)
            if [ "$count" = 0 ]; then
              echo "No release pull request was merged: release-please only updates the next one."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "::error::More than one merged release pull request waits for its release: ${found//$'\n'/, }. Label all but the newest 'autorelease: tagged'."
              exit 1
            fi
            read -r number ref <<< "$found"
            version=$(gh api "repos/${GH_REPO}/contents/.release-please-manifest.json?ref=${ref}" --jq '.content' \
              | base64 -d | jq -r '.["."] // empty')
            echo "Release pull request #${number} was merged as ${ref}."
          fi
          # The strict pattern installs read tags with (ADR 0051): anything else isn't a release.
          if ! [[ "$version" =~ ^(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})(-(alpha|beta)\.[1-9][0-9]{0,4})?$ ]]; then
            echo "::error::'${version}' isn't a version Conch releases."
            exit 1
          fi
          echo "Releasing Conch ${version}."
          {
            echo "release=true"
            echo "version=${version}"
            echo "ref=${ref}"
          } >> "$GITHUB_OUTPUT"

  tag:
    name: Sign the release tag
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Holds RELEASE_SIGNING_KEY; only main may use it (pnpm release key sets it up).
    environment: release
    permissions:
      contents: write # pushes the signed tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
          # Pushes the tag with this job's token.
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache in a job that holds the release key.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install what pnpm release needs, running none of its install scripts
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @conch/server...
      - name: Sign the tag, and check it as installs will
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_TAGGER_NAME: ${{ vars.RELEASE_TAGGER_NAME }}
          RELEASE_TAGGER_EMAIL: ${{ vars.RELEASE_TAGGER_EMAIL }}
        run: pnpm release ci tag --version "$VERSION" --commit HEAD
      - name: Push it
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: git push origin "refs/tags/v${VERSION}"

  rehearse:
    name: Rehearse the signed tag (pushes nothing)
    needs: plan
    if: needs.plan.outputs.rehearse == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The same environment and key as a release, so this proves both.
    environment: release
    permissions:
      contents: read # the code and its tags
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @conch/server...
      - name: Sign a throwaway tag, check it as installs will, and write its page
        env:
          # Below every real release, and never pushed: the runner and its tag go together.
          VERSION: 0.0.1-alpha.1
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_TAGGER_NAME: ${{ vars.RELEASE_TAGGER_NAME }}
          RELEASE_TAGGER_EMAIL: ${{ vars.RELEASE_TAGGER_EMAIL }}
          MAC_SIGNED: ${{ secrets.MAC_CSC_LINK != '' }}
          WINDOWS_SIGNED: ${{ secrets.WIN_CSC_LINK != '' }}
        run: |
          set -euo pipefail
          pnpm release ci tag --version "$VERSION" --commit HEAD
          pnpm release ci page --version "$VERSION" --out "$RUNNER_TEMP/page.md"
          {
            echo "## Rehearsal: v${VERSION}, signed and checked, not pushed"
            echo '```'
            git cat-file -p "v${VERSION}" | sed '/-----BEGIN SSH SIGNATURE-----/,$d'
            echo '```'
            cat "$RUNNER_TEMP/page.md"
          } >> "$GITHUB_STEP_SUMMARY"

  release-please:
    name: Release pull request
    needs: [plan, tag]
    # Every push to main, and after the tag when there's a release: release-please
    # then makes that tag's GitHub Release (a draft) instead of an unsigned tag.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.rehearse != 'true' && needs.tag.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # release-please’s branch and the draft release
      pull-requests: write # opens and updates the release pull request
      issues: write # its “autorelease” labels
    outputs:
      pr: ${{ steps.release-please.outputs.pr }}
    steps:
      # A GitHub App's token, when there is one, so CI runs on the release pull
      # request (pull requests GitHub's own token opens don't start workflows).
      - name: Use the release app, if there is one
        id: app
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-please
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Only a run that signed the tag makes a release: release-please would
          # otherwise make its own, unsigned, for a merge plan didn't see.
          skip-github-release: ${{ needs.plan.outputs.release != 'true' || needs.plan.outputs.published == 'true' }}

  notes:
    name: Conch's notes on the release pull request
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.result == 'success' && needs.release-please.outputs.pr != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # pushes the notes to the release branch
      pull-requests: write # rewrites the pull request’s description
      actions: write # starts CI on the release branch when no app pushed it
    steps:
      # Merged in the moment since release-please updated it: its notes are past changing.
      - name: Is the pull request still open?
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ fromJSON(needs.release-please.outputs.pr).number }}
        run: echo "open=$([ "$(gh pr view "$PR" --json state --jq .state)" = OPEN ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Use the release app, if there is one
        id: app
        if: steps.open.outputs.open == 'true' && vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - if: steps.open.outputs.open == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
          # Pushes the notes to the release branch.
          persist-credentials: true
      - if: steps.open.outputs.open == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.open.outputs.open == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - if: steps.open.outputs.open == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @conch/server...
      - name: Write the notes, polished by Claude when there's a key
        if: steps.open.outputs.open == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pnpm release ci notes --body-file "$RUNNER_TEMP/body.md" --not-ready-file "$RUNNER_TEMP/not-ready"
          # As CI's format check wants them, whatever words the notes have, and
          # release-please's manifest, which it writes as compact JSON.
          pnpm exec prettier --write CHANGELOG.md release-please-config.json .release-please-manifest.json
      - name: Put them on the pull request
        if: steps.open.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ fromJSON(needs.release-please.outputs.pr).number }}
        run: |
          set -euo pipefail
          git add -- CHANGELOG.md release-please-config.json .release-please-manifest.json
          git rm --quiet --cached --ignore-unmatch -- release-notes.md
          if ! git diff --cached --quiet; then
            git -c user.name="$BOT_NAME" -c user.email="$BOT_EMAIL" commit --quiet -m "chore: Conch's notes for this release"
            git push --quiet origin HEAD
          fi
          gh pr edit "$PR" --body-file "$RUNNER_TEMP/body.md"
      # The pull request's own runs wait for approval (GitHub counts its bot as an
      # outside contributor), and a waiting run keeps the branch rules from passing.
      # Approve them: they run main's code with release-please's version, nothing
      # else. If there are none, or approving isn't allowed, start CI on the branch.
      - name: Run CI on the release pull request
        if: steps.open.outputs.open == 'true' && vars.RELEASE_APP_CLIENT_ID == ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          held() {
            gh api "repos/${GH_REPO}/actions/runs?head_sha=${head}&event=pull_request&status=action_required" \
              --jq '.workflow_runs[].id'
          }
          # They appear a moment after the push.
          ids=""
          for _ in 1 2 3 4 5 6; do
            ids=$(held)
            [ -n "$ids" ] && break
            sleep 10
          done
          approved=0
          for id in $ids; do
            if gh api -X POST "repos/${GH_REPO}/actions/runs/${id}/approve" >/dev/null; then
              approved=$((approved + 1))
            fi
          done
          if [ "$approved" -gt 0 ]; then
            echo "Approved ${approved} waiting run(s) on ${head:0:8}."
            exit
          fi
          # Once a commit: a push to main that leaves the branch as it was starts nothing.
          ran=$(gh run list --workflow ci.yml --commit "$head" --json databaseId --jq length)
          if [ "$ran" = 0 ]; then
            gh workflow run ci.yml --ref "$BRANCH"
            echo "Started CI on ${BRANCH} (${head:0:8})."
          else
            echo "CI has already run on ${head:0:8}."
          fi
      # Merged now, it couldn't be released: say so where the merge button is.
      - name: Is it ready to merge?
        if: steps.open.outputs.open == 'true'
        run: |
          if [ -s "$RUNNER_TEMP/not-ready" ]; then
            echo "::error::Not ready to merge: $(cat "$RUNNER_TEMP/not-ready")"
            exit 1
          fi

  desktop:
    name: The apps
    needs: [plan, release-please]
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' && needs.plan.outputs.published != 'true' && needs.release-please.result == 'success' }}
    permissions:
      contents: write # attaches the apps to the draft
      id-token: write # signs the build provenance
      attestations: write # records it
    # `$/` is this repository at the very commit running (unlike `./`), so it
    # counts as pinned. actionlint (1.7.12) doesn't know it yet.
    uses: $/.github/workflows/desktop.yml
    with:
      tag: v${{ needs.plan.outputs.version }}
    secrets:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  publish:
    name: Publish the release
    needs: [plan, desktop]
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # publishes the draft
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.plan.outputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @conch/server...
      - name: Write the release's page
        env:
          MAC_SIGNED: ${{ secrets.MAC_CSC_LINK != '' }}
          WINDOWS_SIGNED: ${{ secrets.WIN_CSC_LINK != '' }}
        run: pnpm release ci page --version "$VERSION" --out "$RUNNER_TEMP/page.md"
      - name: Publish it, once everything it promises is there
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          case "$VERSION" in
            *-*) prerelease=true; latest=false ;;
            *) prerelease=false; latest=true ;;
          esac
          assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
          for file in SHA256SUMS "conch-${VERSION}.spdx.json" latest.yml latest-mac.yml latest-linux.yml; do
            grep -qxF "$file" <<< "$assets" || { echo "::error::${tag}'s draft has no ${file}."; exit 1; }
          done
          gh release edit "$tag" --title "Conch ${VERSION}" --notes-file "$RUNNER_TEMP/page.md" \
            --draft=false --prerelease="$prerelease" --latest="$latest"
          echo "Published Conch ${VERSION}: $(gh release view "$tag" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"

  website:
    name: Update the website
    needs: [plan, publish]
    # After publishing, or on a run that finishes one published before.
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' && (needs.publish.result == 'success' || needs.plan.outputs.published == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # starts the website workflow
    steps:
      # A release GitHub's own token publishes starts no workflow by itself.
      - name: Start the Website workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run site.yml --ref main
