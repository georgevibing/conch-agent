# zizmor checks the workflows themselves for security mistakes: unpinned
# actions, tokens with more permissions than they need, credentials left in a
# checkout, untrusted text pasted into a script. It runs when a workflow
# changes, and fails with the findings as annotations on the pull request.
# Run it locally with `uvx zizmor .github` (https://docs.zizmor.sh).
name: Workflow security

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/dependabot.yml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/dependabot.yml'

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # zizmor itself is pinned too; Dependabot can't see this one, so
          # bump it by hand now and then.
          version: '1.30.1'
          advanced-security: false
          annotations: true
