# OpenSSF Scorecard checks how the project is kept: pinned actions, token
# permissions, branch protection, signed releases and more. The results go to
# Security → Code scanning and to the public Scorecard badge in the README.
#
# Publishing the results lets the Scorecard service check this file, so it is
# kept exactly as Scorecard's documentation asks: no workflow-level write
# permissions, no `env` or `defaults`, an Ubuntu runner, and only the steps
# below. https://github.com/ossf/scorecard-action#workflow-restrictions
name: Scorecard

on:
  # For the Branch-Protection check: runs when a branch rule changes.
  branch_protection_rule:
  # Weekly, so the Maintained check stays current.
  schedule:
    - cron: '41 5 * * 2'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      # To upload the results to code scanning.
      security-events: write
      # To publish the results and the badge.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
