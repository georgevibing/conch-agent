name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release starts it on the release pull request's branch: GitHub doesn't start
  # workflows for what its own token pushes, and the branch rules want `check`
  # and `desktop` on that commit (docs/RELEASING.md).
  workflow_dispatch:

# Every job only reads the repository. Checkout keeps no credentials: nothing
# here pushes. A job that needs more asks for it by itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Format, lint, types and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test:tooling
      - run: pnpm exec turbo run lint typecheck --concurrency=2
      - run: pnpm build-storybook
      - run: pnpm docs:build

  unit:
    name: Unit / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: server 1 of 2
            command: pnpm --filter @conch/server test --maxWorkers=2 --shard=1/2
          - suite: server 2 of 2
            command: pnpm --filter @conch/server test --maxWorkers=2 --shard=2/2
          - suite: nacre
            command: pnpm --filter @conch/nacre test --maxWorkers=2
          - suite: web, docs, protocol and desktop
            command: pnpm exec turbo run test --filter='!@conch/server' --filter='!@conch/nacre' --concurrency=1 -- --maxWorkers=2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Bound concurrency on each runner; scale out instead of competing with axe,
      # real sockets and child processes on the same machine. Run every suite even
      # if another fails, so one cleanup error doesn't hide the rest of the results.
      - if: startsWith(matrix.suite, 'server ')
        run: pnpm exec playwright install --with-deps --no-shell chromium
      - run: ${{ matrix.command }}

  e2e:
    name: Browser journeys / ${{ matrix.shard }} of 4
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CONCH_E2E_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Full Chromium in new headless mode; Headless Shell crashes on these pages.
      # The config's chromium channel and this install must stay in agreement.
      - run: pnpm exec playwright install --with-deps --no-shell chromium
      - run: pnpm e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # The desktop app (ADR 0054), driven for real: it opens Conch, keeps it
  # running with its window closed, restarts a crashed gateway, and quits.
  # Its id is the required check `desktop` in the main ruleset: no `name`, so it stays that.
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ubuntu 24.04 keeps apps from making the namespaces Chromium's sandbox uses.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a pnpm desktop:e2e
      # Keep evidence of a failed first attempt even when the retry passes.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-e2e-results
          path: test-results/desktop/
          retention-days: 7
          if-no-files-found: ignore

  # Commit subjects become the next version and the release notes, and a
  # squash merge turns the title into one, so a pull request checks them all
  # (scripts/commits.mjs). The title is read when the job runs, so after fixing
  # it, re-running this job is enough.
  commits:
    name: Conventional commits
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # the commits
      pull-requests: read # the pull request's title as it is now
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check the commit subjects and the title
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # A run started by hand has no pull request of its own: the branch's open one, if any.
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            node scripts/commits.mjs "origin/main..HEAD"
            exit
          fi
          read -r base title < <(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json baseRefName,title --jq '"\(.baseRefName) \(.title)"')
          node scripts/commits.mjs "origin/$base..HEAD" --title "$title"
      # Merged with no key in the list, a release couldn't be signed (docs/RELEASING.md).
      - name: A release pull request can be released
        if: startsWith(github.head_ref || github.ref_name, 'release-please--')
        run: |
          if ! grep -Eq '^[^#[:space:]][^[:space:]]* +namespaces="git" +[a-z0-9@.-]+ +[A-Za-z0-9+/=]+' release/allowed_signers; then
            echo "::error file=release/allowed_signers::No release key: run pnpm release key and push the list before merging."
            exit 1
          fi

  # Preserve one stable gate for branch rules. Website publication still waits
  # for the entire CI workflow, so no partial pass can publish the site. The
  # commit check runs for every run but a push to main, which may skip it.
  # The required check `check` in the main ruleset.
  check:
    if: ${{ always() }}
    needs: [static, unit, e2e, desktop, commits]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every suite to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          node -e '
            const jobs = JSON.parse(process.env.RESULTS);
            const optional = process.env.EVENT === "push" ? ["commits"] : [];
            const passed = (name, job) =>
              job.result === "success" || (job.result === "skipped" && optional.includes(name));
            let ok = true;
            for (const [name, job] of Object.entries(jobs)) {
              console.log(`${name}: ${job.result}`);
              if (!passed(name, job)) ok = false;
            }
            if (!ok) process.exit(1);
          '
