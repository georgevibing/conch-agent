name: Desktop app

# The app for every platform (ADR 0054). The Release workflow calls this when
# a release pull request is merged (ADR 0127): every installer, its update
# feed, SHA256SUMS, an SBOM and build provenance go on the release's draft,
# which Release then publishes. Run it by hand to build without releasing
# (the files stay with the run for two weeks), or to attach the files to a
# release tag that has none.
on:
  workflow_call:
    inputs:
      tag:
        description: 'The release tag (v0.3.0) whose draft release gets the apps.'
        required: true
        type: string
    # Code signing, when the certificates are set up (docs/RELEASING.md).
    secrets:
      MAC_CSC_LINK:
        required: false
      MAC_CSC_KEY_PASSWORD:
        required: false
      WIN_CSC_LINK:
        required: false
      WIN_CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Attach the apps to this release tag (v0.3.0). Leave empty to only build them.'
        required: false
        default: ''

concurrency:
  group: desktop-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each is built on its own kind of computer: the native modules it carries are made there.
          - { name: mac-arm64, os: macos-latest }
          - { name: mac-x64, os: macos-15-intel }
          - { name: win-x64, os: windows-latest }
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # A release is built from nothing cached.
          cache: ${{ inputs.tag == '' && 'pnpm' || '' }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # Ubuntu 24.04 keeps apps from making the namespaces Chromium's sandbox uses.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # electron-builder's own fpm (which makes the .deb) is for x64 only.
      - if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          sudo apt-get update && sudo apt-get install -y ruby ruby-dev
          sudo gem install fpm --no-document
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
      # Signing and notarizing happen only when these secrets are set (docs/RELEASING.md).
      # An unset secret leaves its variable unset, never empty: an empty CSC_LINK is an error.
      - name: Use the signing secrets, if there are any
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          put() { { echo "$1<<CONCH_EOF"; echo "$2"; echo "CONCH_EOF"; } >> "$GITHUB_ENV"; }
          if [ "$RUNNER_OS" = macOS ] && [ -n "$MAC_CSC_LINK" ]; then
            put CSC_LINK "$MAC_CSC_LINK"
            put CSC_KEY_PASSWORD "$MAC_CSC_KEY_PASSWORD"
            if [ -n "$APPLE_API_KEY" ]; then
              # electron-builder reads the App Store Connect key from a file.
              key="$RUNNER_TEMP/AuthKey.p8"
              printf '%s' "$APPLE_API_KEY" > "$key"
              put APPLE_API_KEY "$key"
              put APPLE_API_KEY_ID "$APPLE_API_KEY_ID"
              put APPLE_API_ISSUER "$APPLE_API_ISSUER"
            fi
          fi
          if [ "$RUNNER_OS" = Windows ] && [ -n "$WIN_CSC_LINK" ]; then
            put CSC_LINK "$WIN_CSC_LINK"
            put CSC_KEY_PASSWORD "$WIN_CSC_KEY_PASSWORD"
          fi
      - name: Build the app
        run: pnpm desktop:build
      - name: Check it starts
        if: runner.os != 'Linux'
        run: node apps/desktop/scripts/smoke.mjs
      - name: Check it starts
        if: runner.os == 'Linux'
        run: xvfb-run -a node apps/desktop/scripts/smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/out/*.dmg
            apps/desktop/out/*.zip
            apps/desktop/out/*.exe
            apps/desktop/out/*.AppImage
            apps/desktop/out/*.deb
            apps/desktop/out/*.blockmap
            apps/desktop/out/latest*.yml

  publish:
    name: Attach to the release
    needs: build
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # attaches the files to the release
      id-token: write # signs the build provenance
      attestations: write # records it
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      # Every package the release is built from, as SPDX: from the source and
      # its lockfile, before the apps are here to be scanned too.
      - name: Write the software bill of materials
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/conch.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: built
      - name: Gather the files
        run: |
          mkdir release
          for dir in built/desktop-*; do
            find "$dir" -maxdepth 1 -type f ! -name 'latest-mac.yml' -exec cp {} release/ \;
          done
          # The two Macs each wrote a feed naming their own files: one feed names both.
          node apps/desktop/scripts/feeds.mjs merge release/latest-mac.yml \
            built/desktop-mac-arm64/latest-mac.yml built/desktop-mac-x64/latest-mac.yml
          cp "$RUNNER_TEMP/conch.spdx.json" "release/conch-${TAG#v}.spdx.json"
          ls -la release
      - name: Check every app is the tag's version
        id: version
        run: |
          version="${TAG#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          for feed in release/latest*.yml; do
            grep -qx "version: ${version}" "$feed" || { echo "$feed isn't ${version}"; cat "$feed"; exit 1; }
          done
      - name: List every file's checksum
        working-directory: release
        run: |
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          sbom-path: release/conch-${{ steps.version.outputs.version }}.spdx.json
      - name: Attach the files to the release
        run: |
          # The Release workflow made the draft. Run by hand for a tag without
          # a release, this makes one, as a draft, from the tag's notes.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" --draft --verify-tag --notes-from-tag --title "Conch ${TAG#v}" $prerelease
          fi
          gh release upload "$TAG" release/* --clobber
