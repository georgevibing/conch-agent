name: Desktop app

# The app for every platform (ADR 0054), built when `pnpm release` pushes a
# release tag, and attached to that tag's GitHub Release. Run it by hand to
# build without releasing (the files stay with the run), or to attach them
# to a tag that's already pushed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Attach the apps to this release tag (v0.3.0). Leave empty to only build them.'
        required: false
        default: ''

concurrency:
  group: desktop-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each is built on its own kind of computer: the native modules it carries are made there.
          - { name: mac-arm64, os: macos-latest }
          - { name: mac-x64, os: macos-15-intel }
          - { name: win-x64, os: windows-latest }
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ubuntu 24.04 keeps apps from making the namespaces Chromium's sandbox uses.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # electron-builder's own fpm (which makes the .deb) is for x64 only.
      - if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          sudo apt-get update && sudo apt-get install -y ruby ruby-dev
          sudo gem install fpm --no-document
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
      # Signing and notarizing happen only when these secrets are set (docs/RELEASING.md).
      # An unset secret leaves its variable unset, never empty: an empty CSC_LINK is an error.
      - name: Use the signing secrets, if there are any
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          put() { { echo "$1<<CONCH_EOF"; echo "$2"; echo "CONCH_EOF"; } >> "$GITHUB_ENV"; }
          if [ "$RUNNER_OS" = macOS ] && [ -n "$MAC_CSC_LINK" ]; then
            put CSC_LINK "$MAC_CSC_LINK"
            put CSC_KEY_PASSWORD "$MAC_CSC_KEY_PASSWORD"
            if [ -n "$APPLE_API_KEY" ]; then
              # electron-builder reads the App Store Connect key from a file.
              key="$RUNNER_TEMP/AuthKey.p8"
              printf '%s' "$APPLE_API_KEY" > "$key"
              put APPLE_API_KEY "$key"
              put APPLE_API_KEY_ID "$APPLE_API_KEY_ID"
              put APPLE_API_ISSUER "$APPLE_API_ISSUER"
            fi
          fi
          if [ "$RUNNER_OS" = Windows ] && [ -n "$WIN_CSC_LINK" ]; then
            put CSC_LINK "$WIN_CSC_LINK"
            put CSC_KEY_PASSWORD "$WIN_CSC_KEY_PASSWORD"
          fi
      - name: Build the app
        run: pnpm desktop:build
      - name: Check it starts
        if: runner.os != 'Linux'
        run: node apps/desktop/scripts/smoke.mjs
      - name: Check it starts
        if: runner.os == 'Linux'
        run: xvfb-run -a node apps/desktop/scripts/smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/out/*.dmg
            apps/desktop/out/*.zip
            apps/desktop/out/*.exe
            apps/desktop/out/*.AppImage
            apps/desktop/out/*.deb
            apps/desktop/out/*.blockmap
            apps/desktop/out/latest*.yml

  publish:
    name: Attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: built
      - name: Gather the files
        run: |
          mkdir release
          for dir in built/desktop-*; do
            find "$dir" -maxdepth 1 -type f ! -name 'latest-mac.yml' -exec cp {} release/ \;
          done
          # The two Macs each wrote a feed naming their own files: one feed names both.
          node apps/desktop/scripts/feeds.mjs merge release/latest-mac.yml \
            built/desktop-mac-arm64/latest-mac.yml built/desktop-mac-x64/latest-mac.yml
          ls -la release
      - name: Check every app is the tag's version
        run: |
          version="${TAG#v}"
          for feed in release/latest*.yml; do
            grep -qx "version: ${version}" "$feed" || { echo "$feed isn't ${version}"; cat "$feed"; exit 1; }
          done
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
      - name: Make the GitHub Release if pnpm release couldn't, then attach the apps
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" --verify-tag --notes-from-tag --title "Conch ${TAG#v}" $prerelease
          fi
          gh release upload "$TAG" release/* --clobber
