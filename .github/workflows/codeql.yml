# CodeQL reads Conch's code for security problems: the TypeScript of every
# app and package, and these workflows themselves. What it finds appears under
# Security → Code scanning, and on the pull request that would add it.
# GitHub's own "default setup" for CodeQL must be off, or it refuses these
# results (docs/REPOSITORY-SETTINGS.md).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new queries find old code too.
    - cron: '23 4 * * 1'

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze / ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # the code
      security-events: write # uploads the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Neither language needs a build: CodeQL reads the source as it is.
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
