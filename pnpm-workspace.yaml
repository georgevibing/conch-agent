packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  esbuild: true
  # Optional: picks a prebuilt binary (or compiles on Linux). If it fails,
  # installation still succeeds and terminals use Python/basic mode.
  node-pty: true
  # Memory search by meaning (ADR 0041) runs on the CPU with the binaries the
  # package ships; its install script would only fetch CUDA libraries.
  onnxruntime-node: false
  # Its install script only checks the protobufjs version; nothing to build.
  protobufjs: false
autoInstallPeers: true
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.71.0'
  - '@typescript-eslint/parser@8.71.0'
  - '@typescript-eslint/project-service@8.71.0'
  - '@typescript-eslint/scope-manager@8.71.0'
  - '@typescript-eslint/tsconfig-utils@8.71.0'
  - '@typescript-eslint/type-utils@8.71.0'
  - '@typescript-eslint/types@8.71.0'
  - '@typescript-eslint/typescript-estree@8.71.0'
  - '@typescript-eslint/utils@8.71.0'
  - '@typescript-eslint/visitor-keys@8.71.0'
  - framer-motion@13.4.5
  - motion-dom@13.4.5
  - motion@13.4.5
  - typescript-eslint@8.71.0
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.284'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.284'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.284'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.284'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.284'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.284'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.284'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.284'
  - '@anthropic-ai/claude-agent-sdk@0.3.284'
  - '@anthropic-ai/sdk@0.129.0'
  - '@modelcontextprotocol/sdk@1.31.0'
strictPeerDependencies: false
# Scripts use POSIX syntax (`VAR=${VAR:-1} cmd`); cmd.exe can't run it, so run
# every script through pnpm's cross-platform shell instead.
shellEmulator: true
