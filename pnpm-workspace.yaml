packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  # WhatsApp (ADR 0043): its preinstall only checks the Node version, and
  # protobufjs's postinstall only prints a notice. Neither is needed.
  '@whiskeysockets/baileys': false
  # The desktop app (ADR 0054): its install script downloads Electron itself,
  # checked against the checksums the package ships.
  electron: true
  # electron-builder's Squirrel.Windows maker; the app is installed with NSIS instead.
  electron-winstaller: false
  esbuild: true
  # Optional: picks a prebuilt binary (or compiles on Linux). If it fails,
  # installation still succeeds and terminals use Python/basic mode.
  node-pty: true
  # Memory search by meaning (ADR 0041) runs on the CPU with the binaries the
  # package ships; its install script would only fetch CUDA libraries.
  onnxruntime-node: false
  # Its install script only checks the protobufjs version; nothing to build.
  protobufjs: false
autoInstallPeers: true
strictPeerDependencies: false
# Scripts use POSIX syntax (`VAR=${VAR:-1} cmd`); cmd.exe can't run it, so run
# every script through pnpm's cross-platform shell instead.
shellEmulator: true
