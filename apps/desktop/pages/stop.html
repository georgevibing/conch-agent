<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- The gateway looks through windows with this title (computer-use/driver.ts). -->
    <title>Conch is using your computer</title>
    <style>
      /* The Stop card (ADR 0110): Nacre's surface and pearl colours, one button. */
      :root {
        color-scheme: light dark;
        --pearl:
          oklch(0.88 0.075 42), oklch(0.9 0.06 200), oklch(0.86 0.07 265), oklch(0.87 0.07 310),
          oklch(0.89 0.06 355), oklch(0.88 0.075 42);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        font:
          13px/1.3 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        box-sizing: border-box;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 8px 0 14px;
        border-radius: 999px;
        background: light-dark(#fbf9f7, #171c22);
        color: light-dark(#2b2522, #e7eaec);
        border: 1px solid light-dark(#e6ded8, #2c333b);
        box-shadow: 0 10px 30px -12px rgba(40, 30, 50, 0.45);
        animation: arrive 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .pearl {
        flex: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: conic-gradient(var(--pearl));
        animation: breathe 2.4s ease-in-out infinite;
      }
      .words {
        flex: 1;
        min-width: 0;
      }
      .title {
        font-weight: 600;
      }
      .label {
        color: light-dark(#6d625c, #a5adb5);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      a {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 34px;
        padding: 0 12px;
        border-radius: 999px;
        background: light-dark(#2b2522, #e7eaec);
        color: light-dark(#fbf9f7, #171c22);
        font-weight: 600;
        text-decoration: none;
        cursor: default;
      }
      a:focus-visible {
        outline: 2px solid oklch(0.7 0.11 265);
        outline-offset: 2px;
      }
      kbd {
        font: inherit;
        font-weight: 500;
        opacity: 0.7;
      }
      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(-8px) scale(0.98);
        }
      }
      @keyframes breathe {
        50% {
          transform: scale(0.82);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .card,
        .pearl {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="card" role="status">
      <span class="pearl" aria-hidden="true"></span>
      <span class="words">
        <span class="title">Conch is using your computer</span><br />
        <span class="label" id="label"></span>
      </span>
      <a href="#stop" aria-keyshortcuts="Meta+Escape">Stop <kbd>⌘⎋</kbd></a>
    </div>
    <script src="stop.js"></script>
  </body>
</html>
